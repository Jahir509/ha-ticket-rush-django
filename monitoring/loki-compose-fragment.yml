# Add these two services to the compose file that already runs Prometheus
# and Grafana, then: docker compose up -d
services:
  loki:
    image: docker.io/grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

volumes:
  loki-data:
