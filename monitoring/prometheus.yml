global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Django (gunicorn) app. Scraped directly over the LAN, not through the
  # Cloudflare tunnel: the tunnel adds latency, and /metrics should not be
  # public anyway. Port 80 serves the same app, so scraping it as well would
  # count every request twice.
  - job_name: ticketrush-dj
    static_configs:
      - targets: ["10.2.116.112:8001"]
        labels:
          app: django
          host: app-vm

  # To scrape through the tunnel instead, replace the job above with:
  # - job_name: ticketrush-dj
  #   scheme: https
  #   static_configs:
  #     - targets: ["ticket-rush-dj.jahirahmed.com"]
